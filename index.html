<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Prompt Generator — 海报提示词生成器</title>
<style>
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #1a1d28;
  --bg-tertiary: #242838;
  --bg-card: #1e2130;
  --border: #2d3148;
  --border-hover: #4a5170;
  --text-primary: #e8eaf0;
  --text-secondary: #9ba3b8;
  --text-muted: #6b7390;
  --accent: #6c8eef;
  --accent-hover: #8aa5f5;
  --accent-dim: rgba(108,142,239,0.15);
  --success: #4caf86;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}
/* === HEADER === */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 {
  font-size: 18px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.header .logo-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.header .subtitle { font-size: 12px; color: var(--text-muted); font-weight: 400; }
.header-actions { display: flex; gap: 10px; }
.btn-reset {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-secondary); padding: 6px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; transition: var(--transition);
}
.btn-reset:hover { border-color: var(--border-hover); color: var(--text-primary); }

/* === LAYOUT === */
.main-container {
  display: flex; gap: 0; height: calc(100vh - 61px);
}
.left-panel {
  flex: 1; overflow-y: auto; padding: 24px;
}
.right-panel {
  width: 460px; min-width: 460px;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 61px;
}
@media (max-width: 1024px) {
  .main-container { flex-direction: column; height: auto; }
  .right-panel { width: 100%; min-width: 100%; position: relative; top: 0; }
}

/* === SECTIONS === */
.section { margin-bottom: 32px; }
.section-title {
  font-size: 14px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-secondary);
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.section-num {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-dim); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.section-num.active { background: var(--accent); color: #fff; }

/* === STYLE GRID === */
.style-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.style-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.style-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
}
.style-card.selected {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.style-card .card-num {
  font-size: 11px; color: var(--text-muted);
  font-weight: 700; margin-bottom: 4px;
}
.style-card .card-name {
  font-size: 15px; font-weight: 600; margin-bottom: 4px;
}
.style-card .card-name-en {
  font-size: 11px; color: var(--text-muted); margin-bottom: 8px;
}
.style-card .card-desc {
  font-size: 12px; color: var(--text-secondary); line-height: 1.4;
}
.style-card .card-visual {
  font-size: 11px; color: var(--accent);
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
}
.style-card .checkmark {
  position: absolute; top: 10px; right: 10px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: none; align-items: center; justify-content: center;
  font-size: 12px;
}
.style-card.selected .checkmark { display: flex; }

/* === FORM === */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 6px; color: var(--text-primary);
}
.form-label .required { color: var(--accent); }
.form-label .hint { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: 6px; }
.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  transition: var(--transition);
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.form-textarea { resize: vertical; min-height: 70px; }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* Season selector */
.season-grid { display: flex; gap: 8px; }
.season-btn {
  flex: 1; padding: 8px 0;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer; font-size: 13px;
  transition: var(--transition); text-align: center;
}
.season-btn:hover { border-color: var(--border-hover); }
.season-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* Toggle */
.toggle-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-secondary);
  margin-bottom: 12px;
}
.toggle-switch {
  width: 36px; height: 20px;
  background: var(--border); border-radius: 10px;
  position: relative; cursor: pointer; transition: var(--transition);
}
.toggle-switch.on { background: var(--accent); }
.toggle-switch::after {
  content: ''; position: absolute;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px;
  transition: var(--transition);
}
.toggle-switch.on::after { left: 18px; }

/* Collapsible */
.collapsible-header {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; padding: 10px 0;
}
.collapsible-header .arrow { transition: var(--transition); }
.collapsible-header.open .arrow { transform: rotate(90deg); }
.collapsible-body { display: none; }
.collapsible-body.open { display: block; }

/* === RIGHT PANEL === */
.preview-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.preview-header h2 { font-size: 14px; font-weight: 700; }
.preview-meta { font-size: 11px; color: var(--text-muted); }
.preview-content {
  flex: 1; overflow-y: auto; padding: 16px 20px;
}
.preview-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted);
  text-align: center; gap: 12px;
}
.preview-empty .icon { font-size: 48px; opacity: 0.3; }
.preview-empty p { font-size: 14px; }
.prompt-block {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 12px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
  color: var(--text-primary);
  max-height: none;
}
.prompt-block .var-highlight {
  color: var(--accent);
  background: var(--accent-dim);
  padding: 1px 4px; border-radius: 3px;
}
.preview-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px;
}
.btn-copy {
  flex: 1; background: var(--accent); color: #fff;
  border: none; padding: 10px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 14px; font-weight: 600;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-copy:hover { background: var(--accent-hover); }
.btn-copy:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
.btn-copy.copied { background: var(--success); }
.btn-download {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-secondary); padding: 10px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 14px; transition: var(--transition);
}
.btn-download:hover { border-color: var(--border-hover); color: var(--text-primary); }

/* Char count */
.char-count {
  font-size: 11px; color: var(--text-muted);
  text-align: right; margin-top: 4px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--success); color: #fff;
  padding: 12px 24px; border-radius: var(--radius);
  font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow); z-index: 999;
  transition: 0.3s ease; opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1><span class="logo-icon">P</span> Poster Prompt Generator <span class="subtitle">— 海报提示词生成器</span></h1>
  </div>
  <div class="header-actions">
    <button class="btn-reset" onclick="resetAll()">重置</button>
  </div>
</div>

<div class="main-container">
  <!-- LEFT PANEL: INPUTS -->
  <div class="left-panel">

    <!-- STEP 1: Style Selection -->
    <div class="section">
      <div class="section-title">
        <span class="section-num active">1</span>
        选择风格模板 / Select Style
      </div>
      <div class="style-grid" id="styleGrid"></div>
    </div>

    <!-- STEP 2: Content Variables -->
    <div class="section" id="contentSection" style="display:none;">
      <div class="section-title">
        <span class="section-num active">2</span>
        填写内容变量 / Fill Content
      </div>

      <div class="form-group">
        <label class="form-label">时间标签 <span class="hint">Date Label — 留空自动填充当前日期</span></label>
        <input type="text" class="form-input" id="vDateLabel" placeholder="MON · 28 · JULY" oninput="updatePreview()">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">星期 <span class="hint">Weekday</span></label>
          <input type="text" class="form-input" id="vWeekday" placeholder="MONDAY" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">日期数字 <span class="hint">Date Number</span></label>
          <input type="text" class="form-input" id="vDateNumber" placeholder="28" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">月份 <span class="hint">Month</span></label>
          <input type="text" class="form-input" id="vMonth" placeholder="JULY" oninput="updatePreview()">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">主标题 <span class="required">*</span> <span class="hint">Main Title — 4-8字</span></label>
        <input type="text" class="form-input" id="vMainTitle" placeholder="秩序之美" oninput="updatePreview()">
        <div class="char-count" id="titleCount">0 字</div>
      </div>

      <div class="form-group">
        <label class="form-label">副标题 <span class="hint">Subtitle — 12-22字</span></label>
        <input type="text" class="form-input" id="vSubtitle" placeholder="在严谨的结构中，发现自由的力量" oninput="updatePreview()">
        <div class="char-count" id="subtitleCount">0 字</div>
      </div>

      <div class="form-group">
        <label class="form-label">主视觉画面描述 <span class="required">*</span> <span class="hint">Main Visual Description</span></label>
        <textarea class="form-textarea" id="vMainVisualDesc" placeholder="geometric architectural composition, rectangles and triangular blocks" oninput="updatePreview()"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">季节色系 <span class="hint">Season — 决定配色方案</span></label>
        <div class="season-grid" id="seasonGrid">
          <button class="season-btn" data-season="Spring" onclick="selectSeason('Spring')">春 Spring</button>
          <button class="season-btn active" data-season="Summer" onclick="selectSeason('Summer')">夏 Summer</button>
          <button class="season-btn" data-season="Autumn" onclick="selectSeason('Autumn')">秋 Autumn</button>
          <button class="season-btn" data-season="Winter" onclick="selectSeason('Winter')">冬 Winter</button>
        </div>
      </div>
    </div>

    <!-- STEP 3: Company Info -->
    <div class="section" id="companySection" style="display:none;">
      <div class="collapsible-header" onclick="toggleCollapsible('companyBody', this)">
        <div class="section-title" style="margin-bottom:0;">
          <span class="section-num active">3</span>
          企业信息 / Company Info <span class="hint" style="font-weight:400;">— 已预填默认值</span>
        </div>
        <span class="arrow">▶</span>
      </div>
      <div class="collapsible-body" id="companyBody">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">公司名称 (EN)</label>
            <input type="text" class="form-input" id="vCompanyEn" value="HUNTZ ENTERPRISES" oninput="updatePreview()">
          </div>
          <div class="form-group">
            <label class="form-label">公司名称 (CN)</label>
            <input type="text" class="form-input" id="vCompanyCn" value="宏兹实业" oninput="updatePreview()">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">地址</label>
          <input type="text" class="form-input" id="vContactAddress" value="珠海市格力金琴健康港12栋" oninput="updatePreview()">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">电话</label>
            <input type="text" class="form-input" id="vContactPhone" value="0756-8639917" oninput="updatePreview()">
          </div>
          <div class="form-group">
            <label class="form-label">邮箱</label>
            <input type="text" class="form-input" id="vContactEmail" value="hello@yourcompany.com" oninput="updatePreview()">
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT PANEL: PREVIEW -->
  <div class="right-panel">
    <div class="preview-header">
      <h2>Generated Prompt</h2>
      <span class="preview-meta" id="previewMeta">— chars</span>
    </div>
    <div class="preview-content" id="previewContent">
      <div class="preview-empty">
        <div class="icon">📋</div>
        <p>选择左侧风格模板并填写内容<br>prompt 将在此实时预览</p>
      </div>
    </div>
    <div class="preview-footer">
      <button class="btn-copy" id="btnCopy" disabled onclick="copyPrompt()">
        <span>📋</span> 复制 Prompt
      </button>
      <button class="btn-download" id="btnDownload" onclick="downloadPrompt()">⬇</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
// === TEMPLATE DATA ===
const TEMPLATES = [
  {
    id: 'album-minimalist',
    num: '01',
    nameCn: '极素画册风',
    nameEn: 'Album Minimalist',
    desc: '低饱和度水墨风景、柔和纸张肌理、治愈素雅',

      Autumn: { palette: 'warm coffee, ochre-rice' },
      Winter: { palette: 'gray-blue, charcoal-cream-white' }
    },
    prompt: `[PURPOSE]: Brand calendar poster — minimalist art-album style

A 9:16 vertical poster in minimalist art-album style. Low saturation, faint paper texture, soft and elegant. Six fixed zones with safe margins.

BASE: {SEASON} palette — base #F6F2EC, accent palette {PALETTE}.

LAYOUT (top to bottom):

- TOP-RIGHT: Weekday "{WEEKDAY}" + date "{DATE_NUMBER}" + month "{MONTH}" in elegant serif (Cormorant Garamond style).

- BOTTOM-RIGHT: A small 1:1 QR code placeholder (15–18% of zone width) with "扫码了解更多" beneath it.

BACKGROUND: Cream-rice white (#F6F2EC) with faint paper grain.

MOOD: Gentle, healing, refined, atmospheric. No promotional tone.

STYLE REFERENCES: Muji catalog aesthetics, Japanese minimalist photography books, low-saturation ink-wash illustration, wabi-sabi.

NEGATIVE: No photography, no 3D render, no high saturation, no strong contrast, no decorative arcs, no complex grid lines, no promotional banners, no emoji, no icons in contact area.`
  },

    nameEn: 'Geometric Composition',

    prompt: `[PURPOSE]: Brand calendar poster — geometric composition style, Bauhaus aesthetic

A 9:16 vertical poster in strict Bauhaus geometric composition style. Absolutely flat, zero texture, zero gradient, zero shadow. The layout uses a rigid asymmetric grid with six fixed zones and a 1px bottom hairline spanning full width.

BASE: {SEASON} color palette — base color {BASE_COLOR}, accent color {ACCENT_COLOR}, block color {BLOCK_COLOR}.

- BOTTOM-RIGHT: A small 1:1 QR code placeholder occupying 15–18% of the zone width, with the label "扫码了解更多" beneath it in small sans-serif.
- FULL WIDTH BOTTOM: A single horizontal 1px hairline.

MOOD: Rational, powerful, ordered. Bauhaus discipline. No promotional tone, no warmth, no softness.

STYLE REFERENCES: Bauhaus poster design, Josef Müller-Brockmann grid systems, Swiss International Typographic Style, hard-edge geometric abstraction.

NEGATIVE: No curves, no rounded corners, no gradients, no shadows, no drop shadows, no 3D effects, no photography, no ink wash, no watercolor, no organic shapes, no decorative ornament, no promotional text, no sale banners, no emoji, no icons in contact area.`
  },
  {
    id: 'warm-retro',
    num: '03',
    nameCn: '暖光复古风',
    nameEn: 'Warm Retro',
    desc: '做旧纸张质感、双层边框、大地色系扁平插画',

    prompt: `[PURPOSE]: Brand calendar poster — warm retro wabi-sabi style

A 9:16 vertical poster in retro-warm wabi-sabi style. Aged-paper texture with fine noise grain and slight edge vignette. A global double-line nested border (outer coffee-brown 1px + inner pale-cream 1px, 8–12px gap). Six fixed zones.

// === STATE ===
let selectedTemplate = null;
let selectedSeason = 'Summer';

// === RENDER STYLE GRID ===
function renderStyleGrid() {
  const grid = document.getElementById('styleGrid');
  grid.innerHTML = TEMPLATES.map(t => `
    <div class="style-card" data-id="${t.id}" onclick="selectStyle('${t.id}')">
      <div class="checkmark">✓</div>
      <div class="card-num">${t.num}</div>
      <div class="card-name">${t.nameCn}</div>
      <div class="card-name-en">${t.nameEn}</div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-visual">${t.visual}</div>
    </div>
  `).join('');
}

// === SELECT STYLE ===
function selectStyle(id) {
  selectedTemplate = TEMPLATES.find(t => t.id === id);
  document.querySelectorAll('.style-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.id === id);
  });
  document.getElementById('contentSection').style.display = 'block';
  document.getElementById('companySection').style.display = 'block';
  updatePreview();
}

// === SEASON ===
function selectSeason(s) {
  selectedSeason = s;
  document.querySelectorAll('.season-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.season === s);
  });
  updatePreview();
}

// === COLLAPSIBLE ===
function toggleCollapsible(id, header) {
  const body = document.getElementById(id);
  body.classList.toggle('open');
  header.classList.toggle('open');
}

// === GET VALUE ===
function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

// === GENERATE PROMPT ===
function generatePrompt() {
  if (!selectedTemplate) return null;
  const t = selectedTemplate;
  const s = t.seasons[selectedSeason];
  let p = t.prompt;

  // Season-specific color variables
  const replacements = {
    '{SEASON}': selectedSeason,
    '{DATE_LABEL}': val('vDateLabel') || 'auto',
    '{WEEKDAY}': val('vWeekday') || 'MONDAY',
    '{DATE_NUMBER}': val('vDateNumber') || '28',
    '{MONTH}': val('vMonth') || 'JULY',
    '{MAIN_TITLE}': val('vMainTitle') || '（请填写主标题）',
    '{SUBTITLE}': val('vSubtitle') || '（请填写副标题）',
    '{MAIN_VISUAL_DESC}': val('vMainVisualDesc') || '（请填写主视觉描述）',
    '{COMPANY_EN}': val('vCompanyEn') || 'HUNTZ ENTERPRISES',
    '{COMPANY_CN}': val('vCompanyCn') || '宏兹实业',
    '{CONTACT_ADDRESS}': val('vContactAddress') || '珠海市格力金琴健康港12栋',
    '{CONTACT_PHONE}': val('vContactPhone') || '0756-8639917',
    '{CONTACT_EMAIL}': val('vContactEmail') || 'hello@yourcompany.com',
    '{SOLAR_TERM}': val('vMainTitle') || '立秋',
  };

  // Color variables by template
  if (t.id === 'album-minimalist') {
    replacements['{PALETTE}'] = s.palette;
  } else if (t.id === 'geometric-composition') {
    replacements['{BASE_COLOR}'] = s.base;
    replacements['{ACCENT_COLOR}'] = s.accent;
    replacements['{BLOCK_COLOR}'] = s.block;
  } else if (t.id === 'warm-retro') {
    replacements['{BASE_COLOR}'] = s.base;
    replacements['{MAIN_COLOR}'] = s.main;
    replacements['{ACCENT_COLOR}'] = s.accent;
  } else if (t.id === 'light-shadow') {
    replacements['{BASE_COLOR}'] = s.base;
    replacements['{BLOCK_COLOR}'] = s.block;
  } else if (t.id === 'silent-humanist') {
    replacements['{BASE_COLOR}'] = s.base;
    replacements['{MAIN_TONE}'] = s.tone;
    replacements['{SHADOW_COLOR}'] = s.shadow;
  } else if (t.id === 'tech-streamer') {
    replacements['{BASE_COLOR}'] = s.base;
    replacements['{GRADIENT_COLOR}'] = s.gradient;
    replacements['{PARTICLE_COLOR}'] = s.particle;
  } else if (t.id === 'ink-wash') {
    replacements['{BASE_COLOR}'] = s.base;
    replacements['{LANDSCAPE_HUE}'] = s.hue;
  } else if (t.id === 'paper-light-craft') {
    replacements['{TOP_COLOR}'] = s.top;
    replacements['{MID_COLOR}'] = s.mid;
    replacements['{BOTTOM_COLOR}'] = s.bottom;
    replacements['{LIGHT_COLOR}'] = s.light;
    replacements['{PLANT_COLOR}'] = s.plant;
  }

  for (const [key, value] of Object.entries(replacements)) {
    p = p.replaceAll(key, value);
  }
  return p;
}

// === UPDATE PREVIEW ===
function updatePreview() {
  const titleEl = document.getElementById('vMainTitle');
  const subtitleEl = document.getElementById('vSubtitle');
  if (titleEl) {
    document.getElementById('titleCount').textContent = `${titleEl.value.length} 字`;
  }
  if (subtitleEl) {
    document.getElementById('subtitleCount').textContent = `${subtitleEl.value.length} 字`;
  }

  if (!selectedTemplate) return;

  const prompt = generatePrompt();
  if (!prompt) return;

  const content = document.getElementById('previewContent');
  content.innerHTML = `<div class="prompt-block">${escapeHtml(prompt)}</div>`;

  document.getElementById('previewMeta').textContent = `${prompt.length} chars`;
  document.getElementById('btnCopy').disabled = false;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// === COPY ===
function copyPrompt() {
  const prompt = generatePrompt();
  if (!prompt) return;
  navigator.clipboard.writeText(prompt).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.classList.add('copied');
    btn.innerHTML = '<span>✓</span> 已复制';
    showToast('已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span>📋</span> 复制 Prompt';
    }, 2000);
  });
}

// === DOWNLOAD ===
function downloadPrompt() {
  const prompt = generatePrompt();
  if (!prompt) return;
  const blob = new Blob([prompt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `prompt-${selectedTemplate.id}-${selectedSeason}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// === TOAST ===
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// === RESET ===
function resetAll() {
  selectedTemplate = null;
  selectedSeason = 'Summer';
  document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.season-btn').forEach(b => b.classList.toggle('active', b.dataset.season === 'Summer'));
  document.getElementById('contentSection').style.display = 'none';
  document.getElementById('companySection').style.display = 'none';
  ['vDateLabel','vWeekday','vDateNumber','vMonth','vMainTitle','vSubtitle','vMainVisualDesc'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('vCompanyEn').value = 'HUNTZ ENTERPRISES';
  document.getElementById('vCompanyCn').value = '宏兹实业';
  document.getElementById('vContactAddress').value = '珠海市格力金琴健康港12栋';
  document.getElementById('vContactPhone').value = '0756-8639917';
  document.getElementById('vContactEmail').value = 'hello@yourcompany.com';
  document.getElementById('previewContent').innerHTML = `
    <div class="preview-empty">
      <div class="icon">📋</div>
      <p>选择左侧风格模板并填写内容<br>prompt 将在此实时预览</p>
    </div>`;
  document.getElementById('previewMeta').textContent = '— chars';
  document.getElementById('btnCopy').disabled = true;
}
